<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gleam Pro Google Review Card</title>
    <style>
      @page {
        size: 5in 7in;
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #d9d9d9;
        color: #f4efe6;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        position: relative;
        display: flex;
        width: 5in;
        height: 7in;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #050e1f;
        padding: 0.48in 0.45in 0.4in;
        text-align: center;
      }

      .card::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 0.08in;
        background: #d4a574;
        content: "";
      }

      .logo {
        width: 0.86in;
        height: 0.86in;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0.2in 0 0;
        color: #d4a574;
        font-size: 9pt;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 3.9in;
        margin: 0.13in 0 0;
        color: #ffffff;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 27pt;
        font-weight: 500;
        line-height: 1.06;
      }

      .copy {
        max-width: 3.75in;
        margin: 0.13in 0 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 10.5pt;
        line-height: 1.45;
      }

      .qr-frame {
        display: grid;
        width: 2.95in;
        height: 2.95in;
        margin-top: 0.25in;
        place-items: center;
        background: #ffffff;
        padding: 0.12in;
      }

      .qr {
        display: block;
        width: 100%;
        height: 100%;
      }

      .scan {
        margin: 0.16in 0 0;
        color: #ffffff;
        font-size: 10pt;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .footer {
        margin-top: auto;
        color: rgba(255, 255, 255, 0.5);
        font-size: 8.5pt;
        line-height: 1.4;
      }

      @media print {
        body {
          background: transparent;
          padding: 0;
        }

        .card {
          border: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="../../logo-gpc.png" alt="Gleam Pro Cleaning" />
      <p class="eyebrow">Thank you for choosing Gleam Pro</p>
      <h1>How did we do?</h1>
      <p class="copy">
        Your honest feedback helps our local team improve and helps others
        choose their cleaning service with confidence.
      </p>
      <div class="qr-frame">
        <img
          class="qr"
          src="google-review-qr.svg"
          alt="QR code to review Gleam Pro Cleaning on Google"
        />
      </div>
      <p class="scan">Scan to share your experience</p>
      <p class="footer">Gleam Pro Cleaning · New Westminster · Metro Vancouver</p>
    </main>
  </body>
</html>
